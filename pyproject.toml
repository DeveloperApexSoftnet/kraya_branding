[project]
name = "kraya_branding"
authors = [{ name = "Kraya" }]
description = "Kraya branding for the ERPNext / Frappe desk: logo, app tiles, sidebar icon and app name"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
